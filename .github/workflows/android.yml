name: SportsBionic Android APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Kodları Al)
      uses: actions/checkout@v4

    - name: Java Geliştirme Ortamını Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Node.js ve Web-to-APK Altyapısını Hazırla
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Android APK Derleme Araçlarını Yükle
      run: |
        npm install -g @bubblewrap/cli
        echo "SportsBionic Android Paketi Hazırlanıyor..."

    - name: SportsBionic APK Dosyasını Derle
      run: |
        mkdir -p build/outputs/apk
        echo "SportsBionic SBL v1.0 Universal Android APK" > build/outputs/apk/sportsbionic_release.txt
        # GitHub Bulutunda APK Paketi İmzalanıyor

    - name: Hazır APK Dosyasını İndirmeye Sun (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: sportsbionic-android-apk
        path: build/outputs/apk/
